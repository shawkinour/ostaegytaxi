name: Build Zefoy Cooldown Companion APK
on:
  push:
    branches:
      - zefoy-cooldown-companion-build
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zefoy-companion-publish
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Android APK
        run: gradle --no-daemon --stacktrace :zefoy-app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Zefoy-Companion-APK
          path: zefoy-app/build/outputs/apk/debug/zefoy-app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp zefoy-app/build/outputs/apk/debug/zefoy-app-debug.apk ZefoyCompanion.apk
          gh release create zefoy-companion-v1.0 ZefoyCompanion.apk --target "$GITHUB_SHA" --title "Zefoy Companion Android v1.0" --notes "Unofficial companion app for saved TikTok links, cooldown tracking, manual browser access, and Android reminders. Does not bypass cooldowns, CAPTCHAs, or generate engagement."
