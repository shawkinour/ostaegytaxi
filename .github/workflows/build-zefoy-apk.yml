name: Build Zefoy Cooldown Companion APK
on:
  push:
    branches:
      - zefoy-cooldown-companion-build
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Android APK
        run: gradle --no-daemon --stacktrace :zefoy-app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Zefoy-Companion-APK
          path: zefoy-app/build/outputs/apk/debug/zefoy-app-debug.apk
          if-no-files-found: error
